services:
  app:
    build: .
    container_name: astrolabe
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:8080"
    env_file: .env # GITHUB_TOKEN: a classic token with no scopes
    environment:
      # Caddy sets X-Real-IP to the visitor's address; lookups are limited per visitor.
      - CLIENT_IP_HEADER=X-Real-IP
      - ANALYTICS_ORIGINS=https://static.cloudflareinsights.com https://cloudflareinsights.com
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
