server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Handle SPA routing - redirect unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new deploy propagates
    # immediately (hashed asset names change on every build).
    # NOTE: use `expires`, not `add_header Cache-Control` — an add_header
    # inside a location block would stop inheritance of the server-level
    # security headers below.
    location = /index.html {
        expires -1;
    }

    # Hashed static assets are immutable — cache for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
    }

    # Security headers (inherited by all locations above because none of
    # them declare their own add_header directives).
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # Static SPA that only talks to the GitHub API. 'unsafe-inline' styles are
    # required by the runtime CSS-in-JS; tighten further if that changes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com; font-src 'self'; base-uri 'self'; frame-ancestors 'none'";
}
